name: Phoenix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule: # Set the cron for MidNight IST ---UTC
   - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      env:
       description: "Environment"
       type: choice
       options: [qa,uat,dev]
       default: qa
       required: true
      suiteXmlFile:
       description: "TestNG XML file"
       type: choice
       options: [testng.xml,smoke.xml,regression.xml]
       default: testng.xml
       required: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Default Values for Execution
        id: default
        run: |
              echo "suiteXmlFile=${{ github.event.inputs.suiteXmlFile || 'testng.xml' }}" >> $GITHUB_OUTPUT
              echo "env=${{ github.event.inputs.env || 'qa' }}" >> $GITHUB_OUTPUT

      # Execute Tests
      - name: Execute Test Automation Framework
        run: mvn clean test -DsuiteXmlFile="${{ steps.default.outputs.suiteXmlFile }}" -Denv="${{  steps.default.outputs.env }}"

      # Upload Surefire Report
      - name: Upload Surefire Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SureFire Report
          path: target/surefire-reports/
          retention-days: 10
          
