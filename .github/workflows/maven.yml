name: Phoenix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Debug Step 1 - Verify project resources
      - name: Verify Project Resources
        run: |
          echo "Current Directory:"
          pwd

          echo "========================================"
          echo "Contents of src/test/resources"
          echo "========================================"
          find src/test/resources -type f

      # Debug Step 2 - Compile test resources
      - name: Compile Test Resources
        run: mvn test-compile

      # Debug Step 3 - Verify copied resources
      - name: Verify Copied Resources
        run: |
          echo "========================================"
          echo "Contents of target/test-classes"
          echo "========================================"
          find target/test-classes -type f

      # Execute Tests
      - name: Execute Test Automation Framework
        run: mvn clean test -DsuiteXmlFile=testng.xml -Denv=qa

      # Upload Surefire Report
      - name: Upload Surefire Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SureFire Report
          path: target/surefire-reports/
          retention-days: 10
